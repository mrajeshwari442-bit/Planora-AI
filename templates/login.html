<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planora AI - Login</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-brand">
        <div class="brand-logo">📚</div>

        <h1>Planora <span>AI</span></h1>

        <p>Your intelligent study planner</p>
    </div>


    <div class="auth-card">

        <!-- LOGIN -->

        <div id="loginSection">

            <h2>Welcome back 👋</h2>

            <p class="auth-subtitle">
                Login to continue your study journey
            </p>


            <form id="loginForm">

                <label>Email</label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <label>Password</label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-btn"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁️
                    </button>

                </div>


                <button
                    class="primary-btn"
                    type="submit"
                >
                    Login →
                </button>

            </form>


            <div id="loginMessage"></div>


            <div class="divider">
                <span>New to Planora?</span>
            </div>


            <button
                class="secondary-btn"
                onclick="showSignup()"
            >
                ✨ Create Account
            </button>

        </div>


        <!-- SIGNUP -->

        <div id="signupSection" class="hidden">

            <button
                class="back-btn"
                onclick="showLogin()"
            >
                ← Back to Login
            </button>


            <h2>Create account 🚀</h2>

            <p class="auth-subtitle">
                Start planning your studies smarter
            </p>


            <form id="signupForm">

                <label>Username</label>

                <div class="input-box">

                    <span>👤</span>

                    <input
                        type="text"
                        id="signupUsername"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <label>Email</label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <label>Password</label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-btn"
                        onclick="togglePassword('signupPassword', this)"
                    >
                        👁️
                    </button>

                </div>


                <button
                    class="primary-btn"
                    type="submit"
                >
                    Create Account →
                </button>

            </form>


            <div id="signupMessage"></div>

        </div>

    </div>


    <p class="auth-footer">
        🎯 Plan better. Study smarter. Achieve more.
    </p>

</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBeVWkWb5m0EG_2YEqy1LMVDvnZ6nmw7kY",

    authDomain: "planora-ai-b94c8.firebaseapp.com",

    projectId: "planora-ai-b94c8",

    storageBucket: "planora-ai-b94c8.firebasestorage.app",

    messagingSenderId: "536412377280",

    appId: "1:536412377280:web:613111d641454b59e21d25"

};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);



/* SHOW SIGNUP */

window.showSignup = function () {

    document
        .getElementById("loginSection")
        .classList
        .add("hidden");

    document
        .getElementById("signupSection")
        .classList
        .remove("hidden");

};



/* SHOW LOGIN */

window.showLogin = function () {

    document
        .getElementById("signupSection")
        .classList
        .add("hidden");

    document
        .getElementById("loginSection")
        .classList
        .remove("hidden");

};



/* SHOW / HIDE PASSWORD */

window.togglePassword = function (id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

    } else {

        input.type = "password";

        button.textContent = "👁️";

    }

};



/* SEND FIREBASE TOKEN TO FLASK */

async function sendTokenToFlask(user) {

    const idToken = await user.getIdToken();

    const response = await fetch(
        "/auth/firebase-login",
        {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                idToken: idToken
            })

        }
    );

    return await response.json();

}



/* LOGIN */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            message.innerHTML =
                '<div class="loading-message">Logging in...</div>';


            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                const result =
                    await sendTokenToFlask(user);


                if (result.success) {

                    message.innerHTML =
                        '<div class="success-message">✅ Login successful! Redirecting...</div>';


                    setTimeout(() => {

                        window.location.href =
                            "/dashboard";

                    }, 700);

                } else {

                    message.innerHTML =
                        `<div class="server-error">${result.message}</div>`;

                }

            } catch (error) {

                console.error(error);


                let errorMessage =
                    "Login failed. Please try again.";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage =
                        "Incorrect email or password.";

                }


                message.innerHTML =
                    `<div class="server-error">${errorMessage}</div>`;

            }

        }
    );



/* CREATE ACCOUNT */

document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const username =
                document
                    .getElementById("signupUsername")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("signupEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("signupPassword")
                    .value;


            const message =
                document.getElementById(
                    "signupMessage"
                );


            message.innerHTML =
                '<div class="loading-message">Creating account...</div>';


            try {

                /* CREATE FIREBASE USER */

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                /* SAVE USERNAME */

                await updateProfile(
                    user,
                    {
                        displayName: username
                    }
                );


                /* REFRESH TOKEN */

                await user.getIdToken(true);


                /* SEND TOKEN TO FLASK */

                const result =
                    await sendTokenToFlask(user);


                if (result.success) {

                    message.innerHTML =
                        '<div class="success-message">✅ Account created! Redirecting...</div>';


                    setTimeout(() => {

                        window.location.href =
                            "/dashboard";

                    }, 700);

                } else {

                    message.innerHTML =
                        `<div class="server-error">${result.message}</div>`;

                }

            } catch (error) {

                console.error(error);


                let errorMessage =
                    "Account creation failed.";


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    errorMessage =
                        "This email is already registered.";

                }

                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    errorMessage =
                        "Password must contain at least 6 characters.";

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Please enter a valid email.";

                }


                message.innerHTML =
                    `<div class="server-error">${errorMessage}</div>`;

            }

        }
    );

</script>

</body>
</html>
